# sotOs vhost-net fabric · dnsmasq on the tap
interface=sotos0
bind-interfaces
# Static lease: the fixed guest MAC always gets 10.7.0.50 (gates use this IP)
dhcp-range=10.7.0.50,10.7.0.50,255.255.255.0,12h
dhcp-host=52:54:00:12:34:56,10.7.0.50
# Gateway = the tap host IP; DNS forwarders
dhcp-option=3,10.7.0.1
dhcp-option=6,1.1.1.1,8.8.8.8
pid-file=/tmp/sotos-dnsmasq.pid
