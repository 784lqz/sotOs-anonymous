<text x="677" y="83.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#39c5cf" font-weight="bold">OPERATOR VIEW  —  ground truth (serial / sottrace)</text>
<text x="627" y="121" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#6cb6ff">[sottrace] </tspan><tspan fill="#c9d1d9">conn=7 ACCEPT 203.0.113.9:51344 -&gt; :443</tspan></text>
<text x="627" y="140" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#6cb6ff">[sottrace] </tspan><tspan fill="#c9d1d9">conn=7 RESPONSE_PROFILE TLS13 :443 4096 B</tspan></text>
<text x="627" y="159" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#39c5cf">[ja3s] </tspan><tspan fill="#c9d1d9">inbound :443 md5=</tspan><tspan fill="#e6edf3">1af33e16..302c</tspan></text>
<text x="627" y="178" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#6b7689">       == nginx · byte-exact, served by sotOs</tspan></text>
