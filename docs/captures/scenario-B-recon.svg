<text x="627" y="273" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#f85149">       ⤴ non-RFC1918 · flagged likely-C2</tspan></text>
