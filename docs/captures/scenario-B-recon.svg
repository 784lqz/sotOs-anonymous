<text x="627" y="216" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#6cb6ff">[sottrace] </tspan><tspan fill="#c9d1d9">conn=8 RESPONSE_PROFILE SSH :22 1144 B</tspan></text>
