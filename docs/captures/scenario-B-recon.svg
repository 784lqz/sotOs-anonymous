<text x="90" y="83.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#3fb950" font-weight="bold">ATTACKER VIEW  —  what the adversary believes</text>
<text x="40" y="121" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#7ee787">attacker$ </tspan><tspan fill="#e6edf3">nmap -sV honeypot</tspan></text>
<text x="40" y="140" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">22/tcp  open  ssh      </tspan><tspan fill="#3fb950">OpenSSH 9.6 (proto 2.0)</tspan></text>
<text x="40" y="159" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">443/tcp open  ssl/http </tspan><tspan fill="#3fb950">nginx 1.18.0</tspan></text>
<text x="40" y="178" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"></text>
<text x="40" y="197" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#7ee787">attacker$ </tspan><tspan fill="#e6edf3">openssl s_client -connect honeypot:443 -tls1_3</tspan></text>
<text x="40" y="216" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  Protocol : </tspan><tspan fill="#3fb950">TLSv1.3</tspan></text>
<text x="40" y="235" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  Cipher   : </tspan><tspan fill="#3fb950">TLS_AES_256_GCM_SHA384</tspan></text>
<text x="40" y="254" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  Peer cert: CN=honeypot  (TLS handshake OK)</tspan></text>
<text x="40" y="273" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#6b7689">  JA3S/JA4S byte-identical to stock nginx</tspan></text>
<text x="40" y="292" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"></text>
<text x="40" y="311" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#7ee787">attacker$ </tspan><tspan fill="#e6edf3">ssh admin@honeypot -v</tspan></text>
<text x="40" y="330" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  kex: </tspan><tspan fill="#3fb950">curve25519-sha256</tspan><tspan fill="#c9d1d9">  cipher: aes128-ctr</tspan></text>
<text x="40" y="349" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  mac: hmac-sha2-256   host key </tspan><tspan fill="#3fb950">validated</tspan></text>
<text x="40" y="368" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  admin@honeypot&#x27;s password: </tspan><tspan fill="#e6edf3">█</tspan></text>
<text x="40" y="387" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"></text>
<text x="40" y="406" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#3fb950">  # looks, smells, fingerprints like a real box</tspan></text>
