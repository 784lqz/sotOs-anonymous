<text x="26" y="50" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" fill="#6b7689">nmap / openssl / ssh against the deception host · a &#x27;real&#x27; box on the wire, fully recorded underneath</text>
