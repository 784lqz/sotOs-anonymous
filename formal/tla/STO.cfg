SPECIFICATION Spec

CONSTANTS
    Clients = {c1, c2}
    Objects = {o1}
    MaxTx   = 2
    MaxCaps = 2

INVARIANTS
    TypeOK
    OnlyOwnerMutates
    NoLostUpdate
    NoEffectsFromAborted
    CommitOnlyVisibility

\* The invocations sequence grows unbounded; without this constraint the
\* state space is infinite because every Invoke produces a new distinct
\* state via Append. Limiting trace length to 5 invocations keeps TLC
\* tractable while still exploring meaningful interleavings.
CONSTRAINT InvocationsBounded

\* Defined in STO.tla as: InvocationsBounded == Len(invocations) <= 5
